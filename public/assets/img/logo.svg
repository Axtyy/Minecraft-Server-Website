<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- A neutral stand-in logo: an isometric grass block. Replace it with
       your own logo.webp (or set STORE_LOGO) and this is never shown. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7bd65a"/>
      <stop offset="1" stop-color="#4fae3a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#f0a21a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="92" fill="#1c2150" stroke="url(#ring)" stroke-width="8"/>
  <!-- left face: dirt with a grass lip -->
  <polygon points="44,72 100,102 100,166 44,136" fill="#8a5a33"/>
  <polygon points="44,72 100,102 100,116 44,86" fill="#3f9530"/>
  <!-- right face -->
  <polygon points="156,72 100,102 100,166 156,136" fill="#6e4526"/>
  <polygon points="156,72 100,102 100,116 156,86" fill="#327a26"/>
  <!-- top face -->
  <polygon points="100,42 156,72 100,102 44,72" fill="url(#top)"/>
  <!-- pixel speckles, so it reads as a block and not a box -->
  <g fill="#a87447">
    <rect x="56" y="104" width="8" height="8"/><rect x="76" y="126" width="8" height="8"/>
    <rect x="60" y="128" width="6" height="6"/>
  </g>
  <g fill="#573620">
    <rect x="118" y="120" width="8" height="8"/><rect x="138" y="104" width="8" height="8"/>
    <rect x="134" y="132" width="6" height="6"/>
  </g>
  <g fill="#9be27c">
    <rect x="86" y="62" width="8" height="5"/><rect x="112" y="72" width="8" height="5"/>
    <rect x="96" y="84" width="6" height="4"/>
  </g>
</svg>
